# 论文实验设置（Shi et al., AAAI 2026, Section 5.1 / Appendix F）
# 需要覆盖 2011-01-01 至 2024-11-30 的 Qlib 日频数据（含 $vwap）。

mcts:
  total_search_count: 1000      # 搜索次数（alpha 生成数）：1000 / 2000 / 3000
  tree_initial_budget: 3        # 每棵树初始预算 B
  budget_increment: 1           # 树内出现新最高分时预算 +b
  exploration_constant: 1.0     # UCT 探索权重 c
  dimension_temperature: 1.0    # 维度选择 softmax 温度 T
  max_tree_iterations: 30       # 单棵树迭代安全上限（论文未规定）
  max_corrections: 3            # 非法公式的纠错轮数上限（论文为循环至合法）
  max_root_attempts: 3
  initial_seed_formula: null    # 第一棵树的种子公式 f_seed；为空则由 LLM 生成
  random_seed: 0

llm:
  model: "Qwen/Qwen3.8-27B-FP8"   # 论文主实验为 GPT-4.1；模型是实验变量
  base_url: "https://neuroii.com/v1"
  api_key_env: "NEUROII_API_KEY"
  context_window: 32768
  max_tokens: 32768
  min_output_tokens: 4096
  timeout_s: 600.0
  stream: true
  langfuse: "on"
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
  extra_body_by_role:           # 落实建议、转述结果两步关闭 thinking 以节省时间
    refinement:                 # 建议生成已完成诊断；改写画像只需落实建议
      chat_template_kwargs:
        enable_thinking: false
    summary:
      chat_template_kwargs:
        enable_thinking: false
  temperature:                  # 附录 F.1
    portrait: 1.0
    formula: 1.0
    suggestion: 1.0
    refinement: 1.0
    correction: 0.8
    review: 0.1
    summary: 0.7               # 论文未给出
  max_retries: 3
  retry_delay: 1.0

evaluation:
  horizon: 10                   # 预测目标：10 日或 30 日收益（收盘价买卖）
  rank_ic_min: 0.015            # 附录 F.1 有效因子标准
  rank_ir_min: 0.3
  relative_rank_max: 0.95
  relative_rank_min_size: 20     # 库中因子数达到 20 后才启用 R_RankIC/R_RankIR
  turnover_max: 1.6
  max_correlation: 0.8
  few_shot_k: 1
  correlation_filter_ratio: 0.5
  final_alpha_counts: [10, 50, 100]
  min_days: 50
  min_coverage: 0.3

data:
  qlib_provider_uri: null       # 为空时读取环境变量 QLIB_PROVIDER_URI
  universe: "csi300"            # csi300 或 csi1000
  fields: [open, high, low, close, volume, vwap]
  train_period: ["2011-01-01", "2020-12-31"]
  test_period: ["2021-01-01", "2024-11-30"]
  data_revision: "unversioned"  # 数据更新后修改，隔离历史实验

fsa:
  top_k: 3
  min_support: 2

output:
  results_dir: "results"
  experiment_log_file: "logs/mcts_experiments.jsonl"
